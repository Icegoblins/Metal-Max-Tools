# 将 remote-data/ 部署到 GitHub Pages，供桌面端拉取热更新数据。
name: Deploy data to Pages

on:
  push:
    branches: [main, master]
    paths:
      - "remote-data/**"
      - ".github/workflows/deploy-data.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-data
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Pages payload
        run: |
          set -e
          test -f remote-data/manifest.json || (echo "缺少 remote-data/manifest.json" && exit 1)
          echo "Files:"
          find remote-data -type f | head -30
          echo "Total: $(find remote-data -type f | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: remote-data

      - id: deployment
        uses: actions/deploy-pages@v4
